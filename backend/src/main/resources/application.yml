server:
  port: 8090

spring:
  application:
    name: encryprangedb
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/encryprangedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: encryprangedb
    password: change_me
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

encryprangedb:
  crypto:
    aes-master-key: ${ENCRYP_RANGE_AES_KEY:demo-aes-master-key-32-bytes-000}
    ope-master-key: ${ENCRYP_RANGE_OPE_KEY:demo-ope-master-key-32-bytes-000}
    integrity-master-key: ${ENCRYP_RANGE_INTEGRITY_KEY:demo-integrity-key-32-bytes-00}
    key-version: ${ENCRYP_RANGE_KEY_VERSION:v1}
    sensitivity: 32
  eafs:
    bucket-size: 100





